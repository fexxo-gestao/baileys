name: Refresh lockfile and verify

# Branches de dependencia (deps/**, fix/**) mudam package.json sem gerar o yarn.lock
# localmente. Este job regenera o lock no runner do GitHub, commita no proprio branch e
# roda lint, testes e build sobre ele, ja que commit feito pelo GITHUB_TOKEN nao dispara
# os outros workflows.
on:
  push:
    branches:
      - 'deps/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack and Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Regenerate yarn.lock
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Commit yarn.lock when it changed
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock ja estava em dia"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore(deps): regenerate yarn.lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
